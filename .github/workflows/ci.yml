name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Only obsolete PR runs are canceled. Main, scheduled and manual runs are unique.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      sha: ${{ github.sha }}
      extended: ${{ github.event_name == 'schedule' }}

  gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: verify
    if: ${{ always() }}
    steps:
      - name: Require successful verification
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success

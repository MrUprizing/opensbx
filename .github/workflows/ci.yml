name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Vet default and tagged builds
        run: |
          go vet ./...
          go vet -tags='integration,appleintegration,e2e' ./...

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: |
          docker info
          go test -tags=integration ./... -run '^TestIntegration'

  end-to-end:
    name: Docker packaged-binary E2E
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    env:
      OPENSBX_E2E_RUNTIME: docker
      OPENSBX_E2E_BINARY: ${{ runner.temp }}/opensbx-release/opensbx
      OPENSBX_E2E_ARTIFACTS: ${{ runner.temp }}/opensbx-e2e-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archives with GoReleaser
        uses: goreleaser/goreleaser-action@v7.0.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot --skip=publish

      - name: Extract packaged Linux binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opensbx-release"
          shopt -s nullglob
          archives=(dist/opensbx_*_linux_amd64.tar.gz)
          test "${#archives[@]}" -eq 1
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/opensbx-release"
          test -x "$OPENSBX_E2E_BINARY"

      - name: Run packaged-binary E2E suite
        run: go test -race -tags=e2e ./e2e -run '^TestEndToEnd$' -count=1 -v -timeout=12m

      - name: Upload server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-packaged-e2e-server-logs
          path: ${{ runner.temp }}/opensbx-e2e-artifacts
          if-no-files-found: ignore

  apple-e2e:
    name: Apple Container packaged-binary E2E
    runs-on: macos-26
    needs: unit-tests
    timeout-minutes: 25
    env:
      OPENSBX_E2E_RUNTIME: container
      OPENSBX_E2E_BINARY: ${{ runner.temp }}/opensbx-release/opensbx
      OPENSBX_E2E_ARTIFACTS: ${{ runner.temp }}/opensbx-e2e-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archives with GoReleaser
        uses: goreleaser/goreleaser-action@v7.0.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot --skip=publish

      - name: Extract packaged Apple Silicon binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opensbx-release"
          shopt -s nullglob
          archives=(dist/opensbx_*_macos_arm64.tar.gz)
          test "${#archives[@]}" -eq 1
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/opensbx-release"
          test -x "$OPENSBX_E2E_BINARY"

      - name: Install signed Apple Container 1.4.1
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          installer="$RUNNER_TEMP/container-1.4.1-installer-signed.pkg"
          curl --fail --location --silent --show-error \
            https://github.com/apple/container/releases/download/1.4.1/container-1.4.1-installer-signed.pkg \
            --output "$installer"
          printf '%s  %s\n' 'c0d2716afefbb194c93fae662e9cae7cc186bcbcf746816608ec673dd648a6a4' "$installer" | shasum -a 256 --check
          pkgutil --check-signature "$installer"
          sudo installer -pkg "$installer" -target /
          container --version

      - name: Prepare Apple Container runtime
        run: |
          container system kernel set --recommended --force
          container system start
          container image pull --platform linux/arm64 --progress plain \
            ghcr.io/apple/containerization/vminit:0.45.0
          container system status

      - name: Run packaged-binary Apple E2E suite
        run: go test -race -tags=e2e ./e2e -run '^TestEndToEnd$' -count=1 -v -timeout=15m

      - name: Upload Apple E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-packaged-e2e-server-logs
          path: ${{ runner.temp }}/opensbx-e2e-artifacts
          if-no-files-found: ignore

      - name: Stop ephemeral Apple Container runtime
        if: always()
        shell: bash
        run: |
          if command -v container >/dev/null 2>&1 && container system status >/dev/null 2>&1; then
            container system stop
          fi

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Vet default and integration builds
        run: |
          go vet ./...
          go vet -tags='integration,appleintegration,e2e' ./...

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: |
          docker info
          go test -tags=integration ./... -run '^TestIntegration'

  end-to-end:
    name: Real-process Docker E2E
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    env:
      OPENSBX_E2E_RUNTIME: docker
      OPENSBX_E2E_ARTIFACTS: ${{ runner.temp }}/opensbx-e2e-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run real-process E2E suite
        run: go test -race -tags=e2e ./e2e -run '^TestEndToEnd$' -count=1 -v -timeout=12m

      - name: Upload server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-server-logs
          path: ${{ runner.temp }}/opensbx-e2e-artifacts
          if-no-files-found: ignore

name: Verification

on:
  workflow_call:
    inputs:
      sha:
        description: Exact commit to verify and package
        required: true
        type: string
      extended:
        description: Longer runtime-free fuzzing and shuffled repeats
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Hermetic ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Native unit and race tests, package coverage
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          go test -json ./... -count=1 -timeout=5m -coverprofile=diagnostics/coverage.out 2>&1 | tee diagnostics/unit.jsonl
          go tool cover -func=diagnostics/coverage.out | tee diagnostics/coverage-packages.txt
          go test -race -json ./... -count=1 -timeout=5m 2>&1 | tee diagnostics/race.jsonl
      - name: Upload native diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.os }}
          path: diagnostics/
          if-no-files-found: warn

  analysis:
    name: Analysis and runtime-free performance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Check formatting and whitespace
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          # Legacy formatting debt is reported, not silently rewritten. Enforce
          # all Go files touched by the PR, or the current commit for other runs.
          gofmt -l . | tee diagnostics/gofmt-baseline.txt
          base=HEAD^
          if test -n "$PR_BASE"; then base="$PR_BASE"; fi
          git diff --check "$base" HEAD
          bad=0
          while IFS= read -r -d '' file; do
            if test -f "$file" && test -n "$(gofmt -l "$file")"; then
              printf 'Unformatted changed file: %s\n' "$file"
              bad=1
            fi
          done < <(git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.go')
          test "$bad" -eq 0
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
      - name: Vet default, race and tagged builds
        run: |
          set -euo pipefail
          go vet ./... 2>&1 | tee diagnostics/vet.log
          go vet -race ./... 2>&1 | tee diagnostics/vet-race.log
          go vet -tags='integration,appleintegration,e2e,performance' ./... 2>&1 | tee diagnostics/vet-tagged.log
      - name: Staticcheck
        run: |
          set -euo pipefail
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./... 2>&1 | tee diagnostics/staticcheck.log
      - name: Vulnerability scan
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./... 2>&1 | tee diagnostics/govulncheck.log
      - name: Runtime-free performance regressions
        env:
          SYNTHETIC_TESTS: '^Test(Performance.+|HTTPPerformance.+|Lifecycle(Measurements|Verification).+|ReadFirstLogContent.+|FirstLogReadCancellation.+|WritePerformanceReport.+)$'
        run: |
          set -euo pipefail
          go test -json -tags='e2e performance' ./e2e -run "$SYNTHETIC_TESTS" -count=1 -timeout=5m 2>&1 | tee diagnostics/performance.jsonl
          go test -race -json -tags='e2e performance' ./e2e -run "$SYNTHETIC_TESTS" -count=1 -timeout=5m 2>&1 | tee diagnostics/performance-race.jsonl
      - name: Upload analysis diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analysis
          path: diagnostics/
          if-no-files-found: warn

  fuzz:
    name: Fuzz and shuffled regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Discover and run required fuzz targets
        env:
          EXTENDED: ${{ inputs.extended }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          budget=10s
          if test "$EXTENDED" = true; then budget=60s; fi
          for package in proxy client terminaltext sandbox; do
            go test "./internal/$package" -list '^Fuzz' -timeout=2m > "diagnostics/$package-targets.txt"
            mapfile -t targets < <(sed -n '/^Fuzz[A-Za-z0-9_]*$/p' "diagnostics/$package-targets.txt")
            test "${#targets[@]}" -gt 0 || { printf 'Missing required fuzz target in %s\n' "$package"; exit 1; }
            for target in "${targets[@]}"; do
              go test -json "./internal/$package" -run '^$' -fuzz "^$target$" -fuzztime="$budget" -parallel=2 -timeout=3m 2>&1 | tee "diagnostics/$package-$target.jsonl"
            done
          done
      - name: Scheduled sensitive-package shuffled repeats
        if: ${{ inputs.extended }}
        run: |
          set -euo pipefail
          go test -race -json ./internal/docker ./internal/applecontainer ./internal/proxy ./internal/client ./internal/sandbox -shuffle=on -count=5 -timeout=10m 2>&1 | tee diagnostics/shuffled.jsonl
      - name: Upload fuzz diagnostics and failure corpus
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz
          path: |
            diagnostics/
            internal/**/testdata/fuzz/
          if-no-files-found: warn

  integration:
    name: Mandatory Docker integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENSBX_REQUIRE_DOCKER_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Require Docker and run integration
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          timeout 30s docker info 2>&1 | tee diagnostics/docker-info.log
          go test -json -tags=integration ./... -run '^TestIntegration' -count=1 -timeout=15m 2>&1 | tee diagnostics/integration.jsonl
      - name: Upload integration diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-integration
          path: diagnostics/
          if-no-files-found: warn

  e2e:
    name: Packaged and race daemon E2E (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: docker
            archive: linux_amd64
          - os: macos-26
            runtime: container
            archive: macos_arm64
    env:
      OPENSBX_E2E_RUNTIME: ${{ matrix.runtime }}
      GORACE: halt_on_error=1 exitcode=66
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Build release archives
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.14.1
          args: release --clean --snapshot --skip=publish
      - name: Extract native package and build complementary race daemon
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opensbx-release" diagnostics
          printf 'OPENSBX_E2E_ARTIFACTS=%s/opensbx-e2e-artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          shopt -s nullglob
          archives=(dist/opensbx_*_"$ARCHIVE".tar.gz)
          test "${#archives[@]}" -eq 1
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/opensbx-release"
          test -x "$RUNNER_TEMP/opensbx-release/opensbx"
          CGO_ENABLED=1 go build -race -o "$RUNNER_TEMP/opensbx-race" ./cmd/api
      - name: Require Docker runtime
        if: ${{ matrix.runtime == 'docker' }}
        run: timeout 30s docker info
      - name: Install signed Apple Container 1.4.1
        if: ${{ matrix.runtime == 'container' }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          installer="$RUNNER_TEMP/container-1.4.1-installer-signed.pkg"
          curl --fail --location --silent --show-error \
            https://github.com/apple/container/releases/download/1.4.1/container-1.4.1-installer-signed.pkg \
            --output "$installer"
          printf '%s  %s\n' 'c0d2716afefbb194c93fae662e9cae7cc186bcbcf746816608ec673dd648a6a4' "$installer" | shasum -a 256 --check
          pkgutil --check-signature "$installer"
          sudo installer -pkg "$installer" -target /
          container --version
      - name: Prepare Apple runtime
        if: ${{ matrix.runtime == 'container' }}
        run: |
          container system kernel set --recommended --force
          container system start
          container image pull --platform linux/arm64 --progress plain ghcr.io/apple/containerization/vminit:0.45.0
          container system status
      - name: Packaged-binary E2E (harness race only)
        env:
          OPENSBX_E2E_BINARY: ${{ runner.temp }}/opensbx-release/opensbx
        run: |
          set -euo pipefail
          go test -race -json -tags=e2e ./e2e -run '^TestEndToEnd$' -count=1 -timeout=18m 2>&1 | tee diagnostics/packaged-e2e.jsonl
      - name: Race-instrumented daemon E2E (sequential after package cleanup)
        env:
          OPENSBX_E2E_BINARY: ${{ runner.temp }}/opensbx-race
        run: |
          set -euo pipefail
          go test -race -json -tags=e2e ./e2e -run '^TestEndToEnd$' -count=1 -timeout=20m 2>&1 | tee diagnostics/race-daemon-e2e.jsonl
      - name: Upload all E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ matrix.runtime }}
          path: |
            diagnostics/
            ${{ runner.temp }}/opensbx-e2e-artifacts/
          if-no-files-found: warn
      - name: Stop ephemeral Apple runtime
        if: ${{ always() && matrix.runtime == 'container' }}
        run: |
          if command -v container >/dev/null 2>&1 && container system status >/dev/null 2>&1; then
            container system stop
          fi

  gate:
    name: Verification Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [native, analysis, fuzz, integration, e2e]
    if: ${{ always() }}
    steps:
      - name: Reject failed, canceled or skipped mandatory jobs
        env:
          NATIVE: ${{ needs.native.result }}
          ANALYSIS: ${{ needs.analysis.result }}
          FUZZ: ${{ needs.fuzz.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          for result in "$NATIVE" "$ANALYSIS" "$FUZZ" "$INTEGRATION" "$E2E"; do
            test "$result" = success || exit 1
          done
